<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاسبه‌گر قیمت تست و تحویل تاسیسات الکتریکی</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #e8e8e8;
    }
    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 35px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .org-title {
      text-align: center;
      font-size: 1.15rem;
      color: #00d4ff;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.5;
    }
    h1 {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 28px;
      color: #e2e8f0;
      font-weight: 600;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 22px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.92rem;
      color: #cbd5e0;
      line-height: 1.5;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input:focus {
      border-color: #00d4ff;
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      background: linear-gradient(90deg, #00d4ff, #0099cc);
      border: none;
      border-radius: 12px;
      color: #001a22;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 212, 255, 0.35);
    }
    button:active {
      transform: translateY(0);
    }
    .result-box {
      margin-top: 30px;
      padding: 22px;
      background: rgba(0, 212, 255, 0.1);
      border-radius: 14px;
      border: 1px solid rgba(0, 212, 255, 0.25);
      text-align: center;
      display: none;
    }
    .result-box.show {
      display: block;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-label {
      font-size: 0.9rem;
      color: #a0aec0;
      margin-bottom: 6px;
    }
    .result-value {
      font-size: 2.1rem;
      font-weight: 700;
      color: #00d4ff;
      letter-spacing: 1px;
    }
    .gamma-info {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #718096;
    }
    .formula {
      margin-top: 25px;
      font-size: 0.75rem;
      color: #718096;
      text-align: center;
      line-height: 1.6;
      direction: ltr;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="org-title">انجمن مهندسان برق استان البرز</div>
    <h1>محاسبه گر قیمت تست و تحویل تاسیسات الکتریکی</h1>

    <div class="form-group">
      <label for="A">مقدار متوسط حق الزحمه نظارت برق در گروههای چهارگانه ساختمانی</label>
      <input type="number" id="A" value="74000" step="any">
    </div>

    <div class="form-group">
      <label for="N">تعداد واحد</label>
      <input type="number" id="N" value="10" min="1" step="1">
    </div>

    <div class="form-group">
      <label for="C">متراژ اجرا شده بنا</label>
      <input type="number" id="C" value="1100" step="any">
    </div>

    <button onclick="calculate()">محاسبه قیمت</button>

    <div class="result-box" id="resultBox">
      <div class="result-label">مبلغ پیشنهادی (تومان)</div>
      <div class="result-value" id="resultValue">—</div>
      <div class="gamma-info" id="gammaInfo"></div>
    </div>

    <div class="formula">
      γ(n) = 0.85 + 0.15 × 2/(n+1)<br>
      P = (A/32 + A/800 × (C/n)<sup>0.6</sup>) × (n<sup>γ</sup> + 1)
    </div>
  </div>

  <script>
    function calculate() {
      const A = parseFloat(document.getElementById('A').value);
      const n = parseFloat(document.getElementById('N').value);
      const C = parseFloat(document.getElementById('C').value);

      if (isNaN(A) || isNaN(n) || isNaN(C) || n <= 0) {
        alert('لطفاً مقادیر معتبر وارد کنید (تعداد واحد باید بزرگتر از صفر باشد)');
        return;
      }

      // γ(n)
      const gamma = 0.85 + 0.15 * 2 / (n + 1);

      // محاسبه داخل پرانتز
      const term1 = A / 32;
      const cn = C / n;
      const term2 = (A / 800) * Math.pow(cn, 0.6);
      const inside = term1 + term2;

      // ضریب مقیاس
      const mult = Math.pow(n, gamma) + 1;

      // نتیجه نهایی
      const P = inside * mult;

      // نمایش
      document.getElementById('resultValue').textContent = Math.round(P).toLocaleString('fa-IR');
      document.getElementById('gammaInfo').textContent = `γ(n) = ${gamma.toFixed(4)}`;
      document.getElementById('resultBox').classList.add('show');
    }

    // محاسبه اولیه با مقادیر پیش‌فرض
    calculate();
  </script>
</body>
</html>
